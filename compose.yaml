name: veganadda
services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: veganadda
      POSTGRES_USER: veganadda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U veganadda -d veganadda']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
  migrate:
    build: .
    image: ${IMAGE_REF:-veganadda:local}
    command: [--migrate]
    restart: 'no'
    environment: &app_environment
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=db;Database=veganadda;Username=veganadda;Password=${POSTGRES_PASSWORD}
      Authentication__Firebase__ProjectId: ${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID}
      Authentication__Firebase__ApiKey: ${FIREBASE_API_KEY:?Set FIREBASE_API_KEY}
      Authentication__Firebase__AuthDomain: ${FIREBASE_AUTH_DOMAIN:?Set FIREBASE_AUTH_DOMAIN}
      Authentication__Firebase__AppId: ${FIREBASE_APP_ID:?Set FIREBASE_APP_ID}
      Push__SenderId: ${FIREBASE_MESSAGING_SENDER_ID:-}
      Push__VapidKey: ${FIREBASE_WEB_PUSH_VAPID_KEY:-}
      Authentication__AdminFirebaseUid: ${ADMIN_FIREBASE_UID:-}
      Hosting__TrustedProxy: ${TRUSTED_PROXY_IP:-172.30.87.1}
      AllowedHosts: veganadda.com;www.veganadda.com;localhost
      Storage__MediaPath: /data/media
      Storage__KeysPath: /data/keys
      Development__Enabled: 'false'
      Development__Seed: 'false'
    volumes: [media:/data/media, keys:/data/keys]
    depends_on:
      db: {condition: service_healthy}
    networks: [backend]
  web:
    build: .
    image: ${IMAGE_REF:-veganadda:local}
    restart: unless-stopped
    secrets: [firebase_admin]
    environment:
      <<: *app_environment
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_admin
      Analytics__Umami__ScriptUrl: ${UMAMI_SCRIPT_URL:-}
      Analytics__Umami__WebsiteId: ${UMAMI_WEBSITE_ID:-}
      Monitoring__BetterStack__SourceToken: ${BETTERSTACK_SOURCE_TOKEN:-}
      Monitoring__BetterStack__Endpoint: ${BETTERSTACK_ENDPOINT:-}
    ports: ["127.0.0.1:${APP_PORT:-5080}:8080"]
    volumes: [media:/data/media, keys:/data/keys]
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  web_standby:
    profiles: [rollout]
    build: .
    image: ${IMAGE_REF:-veganadda:local}
    restart: unless-stopped
    secrets: [firebase_admin]
    environment:
      <<: *app_environment
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_admin
      Analytics__Umami__ScriptUrl: ${UMAMI_SCRIPT_URL:-}
      Analytics__Umami__WebsiteId: ${UMAMI_WEBSITE_ID:-}
      Monitoring__BetterStack__SourceToken: ${BETTERSTACK_SOURCE_TOKEN:-}
      Monitoring__BetterStack__Endpoint: ${BETTERSTACK_ENDPOINT:-}
    ports: ["127.0.0.1:${APP_STANDBY_PORT:-5081}:8080"]
    volumes: [media:/data/media, keys:/data/keys]
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  backend:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.87.0/24}
volumes:
  database:
  media:
  keys:
secrets:
  firebase_admin:
    file: ${FIREBASE_ADMIN_CREDENTIALS:?Set FIREBASE_ADMIN_CREDENTIALS to a Firebase service-account JSON file path}

