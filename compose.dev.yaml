name: veganadda-dev
services:
  aspire-dashboard:
    image: ${ASPIRE_DASHBOARD_IMAGE:-mcr.microsoft.com/aspire/dashboard:latest}
    profiles: [observability]
    environment:
      ASPIRE_DASHBOARD_APPLICATION_NAME: VeganAdda.Local
      ASPIRE_DASHBOARD_DATA_DIRECTORY: /home/app/dashboard-data
      ASPIRE_DASHBOARD_PERSISTENCE_MODE: run
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:4317:18889"
      - "127.0.0.1:4318:18890"
    volumes: [aspire-dashboard-data:/home/app]
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: veganadda
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: veganadda
    ports: [127.0.0.1:55432:5432]
    volumes: [dev-database:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U veganadda -d veganadda']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dev-database:
  aspire-dashboard-data:
